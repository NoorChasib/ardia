name: Android

on:
  pull_request:
    paths:
      - "apps/phone/android/**"
      - "packages/phone/android/**"
      - "packages/phone/ios/ArdiaKit/Sources/ArdiaShared/Scripts/**"
      - "packages/sync/**"
      - "apps/phone/package.json"
      - "apps/phone/bun.lock"
      - "apps/phone/bunfig.toml"
      - "apps/phone/metro.config.js"
      - "apps/phone/metro-nested-modules.js"
      - ".github/workflows/android.yml"
      - ".github/actions/bun-install/**"
  push:
    branches: [main]
    paths:
      - "apps/phone/android/**"
      - "packages/phone/android/**"
      - "packages/phone/ios/ArdiaKit/Sources/ArdiaShared/Scripts/**"
      - "packages/sync/**"
      - "apps/phone/package.json"
      - "apps/phone/bun.lock"
      - "apps/phone/bunfig.toml"
      - "apps/phone/metro.config.js"
      - "apps/phone/metro-nested-modules.js"
      - ".github/workflows/android.yml"
      - ".github/actions/bun-install/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-phone-${{ hashFiles('apps/phone/android/gradle/wrapper/gradle-wrapper.properties', 'apps/phone/android/**/*.gradle', 'packages/phone/android/build.gradle', 'apps/phone/bun.lock') }}
          restore-keys: gradle-phone-
      - name: The Android SDK parts the build pins
        run: |
          set -euo pipefail
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$manager" --licenses > /dev/null || true
          "$manager" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      - name: The phone app's dependencies
        uses: ./.github/actions/bun-install
        with:
          projects: apps/phone
          cache: phone
      - name: Type check the phone app
        run: bun run --cwd apps/phone check
      - name: Kotlin unit tests (the native module, the app, the design module)
        working-directory: apps/phone/android
        env:
          ARDIA_LAB: "1"
          EXPO_PUBLIC_ARDIA_LAB: "true"
        run: ./gradlew -PardiaLab=true --no-daemon :ardia-phone-native:testDebugUnitTest :app:testDebugUnitTest :ardia-design:testDebugUnitTest --continue --console=plain
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nilla-dev-${{ github.sha }}-android-unit-test-logs
          path: |
            packages/phone/android/build/reports/tests
            apps/phone/android/app/build/reports/tests
            apps/phone/android/ardia-design/build/reports/tests
          if-no-files-found: ignore
          retention-days: 3
