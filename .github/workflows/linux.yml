name: Linux

on:
  pull_request:
    paths:
      - "apps/linux/**"
      - "apps/browser/**"
      - "apps/cli/**"
      - "packages/**"
      - "engine/**"
      - "scripts/linux/**"
      - "scripts/lib/**"
      - "scripts/agent/locked"
      - "infra/feedback/lib/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".nvmrc"
      - ".github/workflows/linux.yml"
      - ".github/actions/linux-setup/**"
      - ".github/actions/bun-install/**"
  push:
    branches: [main]
    paths:
      - "apps/linux/**"
      - "apps/browser/**"
      - "apps/cli/**"
      - "packages/**"
      - "engine/**"
      - "scripts/linux/**"
      - "scripts/lib/**"
      - "scripts/agent/locked"
      - "infra/feedback/lib/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".nvmrc"
      - ".github/workflows/linux.yml"
      - ".github/actions/linux-setup/**"
      - ".github/actions/bun-install/**"
  workflow_dispatch:
    inputs:
      engine:
        description: Engine, the nearest published one (labelled when older than this commit's engine/) or an exact match
        type: choice
        options: [nearest, exact]
        default: nearest

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  ARDIACORE_PREBUILT_REPO: ${{ vars.ARDIACORE_PREBUILT_REPO || 'ardia-browser/ardia' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-setup
      - name: Stock Chromium
        run: echo "$(readlink -f /usr/bin/chromium) $(/usr/bin/chromium --version)"
      - run: scripts/linux/ci-checks.sh --logs "$RUNNER_TEMP/checks"
      - name: Only logs and smoke results go up
        if: failure()
        env:
          UPLOADS: checks
        run: |
          set -euo pipefail
          temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          removed=0
          for name in $UPLOADS; do
            [ -d "$temp/$name" ] || continue
            rm -rf "$temp/$name/cold-app"
            while IFS= read -r -d '' file; do
              magic="$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')"
              case "$magic" in
                4d5a* | 7f454c46 | cffaedfe | cefaedfe | cafebabe | 504b0304 | 1f8b* | fd377a58 | 28b52ffd | 377abcaf | 213c6172 | 4d534346) ;;
                *) printf '%s\n' "$file" | grep -qiE '\.(exe|dll|sys|msi|msix|appx|node|so|dylib|deb|rpm|appimage|apk|ipa|dmg)$' || continue ;;
              esac
              echo "::error::${file#"$temp/"} is a program or an archive, not a log or a smoke result; it was removed before the upload"
              rm -f "$file"
              removed=1
            done < <(find "$temp/$name" -type f -print0)
          done
          exit "$removed"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nilla-dev-${{ github.sha }}-linux-checks-logs
          path: ${{ runner.temp }}/checks
          if-no-files-found: ignore
          retention-days: 3

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENGINE_MODE: ${{ inputs.engine || 'nearest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: engine-key
        run: echo "key=$(engine/engine-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Version
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*MARKETING_VERSION = "\{0,1\}\([^";]*\)"\{0,1\};/\1/p' apps/browser/macos/Ardia.xcodeproj/project.pbxproj | sort -u)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            echo "::error::MARKETING_VERSION isn't one version: '$version'"
            exit 1
          fi
          { echo "VERSION=$version"; echo "CLI_NAME=ardia-cli-$version-linux-x64.tar.gz"; } >> "$GITHUB_ENV"
      - uses: ./.github/actions/linux-setup
        with:
          packages: >-
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libdbus-1-3
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxkbcommon0
            libgbm1 libdrm2 libexpat1 libcairo2 libpango-1.0-0 libudev1 libasound2t64 libglib2.0-0t64
            libgtk-3-0t64 libsecret-1-0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/build-ardiacore/prebuilt-linux-x86_64
          key: engine-linux-x64-v3-${{ steps.engine-key.outputs.key }}-${{ hashFiles('packages/ardiacore/prebuilt-engines-linux.tsv') }}
          restore-keys: engine-linux-x64-v3-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ardia-cli-build
          key: ardia-cli-build-linux-x64-${{ hashFiles('apps/cli/scripts/build.sh', 'apps/cli/requirements.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ardiacore/vendor/ubo
          key: ubo-linux-${{ hashFiles('packages/ardiacore/scripts/ubo.sh') }}
      - name: Engine
        env:
          ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
        run: |
          set -euo pipefail
          args=(--arch linux-x86_64)
          [ "$ENGINE_MODE" = exact ] || args+=(--nearest)
          if ! engine=$(packages/ardiacore/scripts/fetch-engine.sh "${args[@]}"); then
            echo "::error::no Linux engine for engine key ${ENGINE_KEY:0:12}: build it on the Linux builder, publish it with scripts/linux/publish-engine.sh --upload and commit prebuilt-engines-linux.tsv"
            exit 1
          fi
          selected=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["engine_key"])' "$engine/manifest.json")
          if [ "$selected" = "$ENGINE_KEY" ]; then
            label="${GITHUB_SHA:0:12}"
            echo "ENGINE_EXACT=1" >> "$GITHUB_ENV"
            echo "### Linux engine ${ENGINE_KEY:0:12} (exact)" >> "$GITHUB_STEP_SUMMARY"
          else
            label="${GITHUB_SHA:0:12}-engine-${selected:0:12}"
            echo "::warning::built against an older engine, ${selected:0:12}, not this commit's ${ENGINE_KEY:0:12}"
            echo "### Linux engine ${selected:0:12} (older than this commit's ${ENGINE_KEY:0:12})" >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo "ENGINE=$engine"; echo "PACKAGE_NAME=Ardia-linux-x64-$label"; } >> "$GITHUB_ENV"
      - run: bun run --cwd apps/linux build
      - name: uv
        run: curl -LsSf https://astral.sh/uv/0.12.15/install.sh | sh
      - name: ardia CLI
        run: apps/cli/scripts/build.sh "$VERSION" "$RUNNER_TEMP/dist" --platform linux-x64
      - name: Package
        run: |
          set -euo pipefail
          blocker=$(scripts/linux/fetch-ubo.sh)
          python3 scripts/linux/package.py --out "$ENGINE" --ui apps/linux/dist --content-blocker "$blocker" \
            --version "$VERSION" --cli "$RUNNER_TEMP/dist/$CLI_NAME" --destination "$RUNNER_TEMP/dist/$PACKAGE_NAME.tar.xz" \
            --deb "$RUNNER_TEMP/dist/$PACKAGE_NAME.deb" --appimage "$RUNNER_TEMP/dist/$PACKAGE_NAME.AppImage"
          for built in tar.xz deb AppImage; do
            (cd "$RUNNER_TEMP/dist" && sha256sum "$PACKAGE_NAME.$built" > "$PACKAGE_NAME.$built.sha256")
          done
      - name: Smoke
        run: |
          set -euo pipefail
          extra=()
          [ "${ENGINE_EXACT:-0}" = 1 ] || extra+=(--allow-old-engine)
          node scripts/linux/smoke.mjs --package "$RUNNER_TEMP/dist/$PACKAGE_NAME.tar.xz" --results "$RUNNER_TEMP/smoke" --timeout-ms 600000 "${extra[@]}"
          node scripts/linux/smoke.mjs --package "$RUNNER_TEMP/dist/$PACKAGE_NAME.deb" --results "$RUNNER_TEMP/smoke/deb" --timeout-ms 600000 "${extra[@]}"
          node scripts/linux/smoke.mjs --package "$RUNNER_TEMP/dist/$PACKAGE_NAME.AppImage" --results "$RUNNER_TEMP/smoke/appimage" --timeout-ms 600000 "${extra[@]}"
      - name: Only logs and smoke results go up
        if: ${{ !cancelled() }}
        env:
          UPLOADS: smoke
        run: |
          set -euo pipefail
          temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          removed=0
          for name in $UPLOADS; do
            [ -d "$temp/$name" ] || continue
            rm -rf "$temp/$name/cold-app"
            while IFS= read -r -d '' file; do
              magic="$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')"
              case "$magic" in
                4d5a* | 7f454c46 | cffaedfe | cefaedfe | cafebabe | 504b0304 | 1f8b* | fd377a58 | 28b52ffd | 377abcaf | 213c6172 | 4d534346) ;;
                *) printf '%s\n' "$file" | grep -qiE '\.(exe|dll|sys|msi|msix|appx|node|so|dylib|deb|rpm|appimage|apk|ipa|dmg)$' || continue ;;
              esac
              echo "::error::${file#"$temp/"} is a program or an archive, not a log or a smoke result; it was removed before the upload"
              rm -f "$file"
              removed=1
            done < <(find "$temp/$name" -type f -print0)
          done
          exit "$removed"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nilla-dev-${{ github.sha }}-linux-package-logs
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 3
