name: Checks

on:
  pull_request:
    paths: &code
      - "apps/**"
      - "packages/**"
      - "extras/**"
      - "scripts/**"
      - "docs/**"
      - "infra/**"
      - "engine/**"
      - ".claude/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".nvmrc"
      - "patches/**"
      - ".github/workflows/**"
      - ".github/actions/bun-install/**"
  push:
    branches: [main]
    paths: *code

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "typecheck and tests", part: rest }
          - { name: "browser tests, share 1 of 4", part: browser, shard: 1 }
          - { name: "browser tests, share 2 of 4", part: browser, shard: 2 }
          - { name: "browser tests, share 3 of 4", part: browser, shard: 3 }
          - { name: "browser tests, share 4 of 4", part: browser, shard: 4 }
          - { name: "Mac bundle", part: bundle }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-install
        with:
          lockfile-drift: ${{ matrix.part == 'rest' }}
      - name: Type check
        if: matrix.part == 'rest'
        run: bun check
      - name: Tests that need no Mac, the browser's aside
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        run: bun run test:portable:packages --filter=!@ardia/browser
      - name: The tests of the Mac packages that need no Mac
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        run: bun run test:portable:mac
      - name: Repository tests
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        run: bun run test:root
      - name: CI uploads logs and smoke results only
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        run: |
          cat > "$RUNNER_TEMP/artifacts.mjs" <<'JS'
          import { readdirSync, readFileSync } from "node:fs";
          const dir = ".github/workflows";
          const installable = /\.(dmg|zip|app|xcarchive|ipa|apk|aab|exe|msi|msix|appx|dll|deb|rpm|appimage|tar|tar\.xz|tar\.gz|tgz|tar\.zst)(\/|$)|env\.APP\b|\/(installer|dist|release|export)(\/|$)/i;
          const gate = /vars\.NILLA_RELEASES_ENABLED/;
          const prefix = `nilla-dev-$${"{{"} github.sha }}-`;
          const problems = [];
          for (const file of readdirSync(dir).filter((name) => name.endsWith(".yml"))) {
            const jobs = Bun.YAML.parse(readFileSync(`${dir}/${file}`, "utf8")).jobs ?? {};
            const needsOf = (job) => [jobs[job]?.needs ?? []].flat();
            const isGated = (job, seen = new Set()) => {
              if (seen.has(job)) return false;
              seen.add(job);
              if (job === "releases-enabled" || gate.test(String(jobs[job]?.if ?? ""))) return true;
              return needsOf(job).some((need) => isGated(need, seen));
            };
            for (const [job, spec] of Object.entries(jobs)) {
              if (isGated(job)) continue;
              for (const step of spec.steps ?? []) {
                if (!String(step.uses ?? "").startsWith("actions/upload-artifact@") || gate.test(String(step.if ?? ""))) continue;
                const name = String(step.with?.name ?? "");
                const where = `${file} › ${job} › ${name || "(no name)"}`;
                if (!name.startsWith(prefix) || !name.endsWith("-logs")) problems.push(`${where}: name it ${prefix}<what>-logs`);
                if (Number(step.with?.["retention-days"]) !== 3) problems.push(`${where}: retention-days must be 3`);
                for (const line of String(step.with?.path ?? "").split("\n").map((l) => l.trim().replace(/^!/, "")).filter(Boolean)) {
                  if (installable.test(line)) problems.push(`${where}: ${line} looks installable; CI uploads logs and smoke results only`);
                }
              }
            }
          }
          if (problems.length) {
            for (const problem of problems) console.log(`::error::${problem}`);
            process.exit(1);
          }
          console.log("every CI upload is logs or smoke results");
          JS
          bun "$RUNNER_TEMP/artifacts.mjs"
      - name: This share of the browser's tests
        if: matrix.part == 'browser'
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run --cwd apps/browser test --shard="$SHARD/4"
      - name: Bundle the Mac app's JavaScript as a release build does
        if: matrix.part == 'bundle'
        working-directory: apps/browser
        run: |
          bun x --no-install react-native bundle --platform macos --entry-file index.js --dev false --minify false --reset-cache --bundle-output "$RUNNER_TEMP/main.jsbundle" --assets-dest "$RUNNER_TEMP/assets"
          ls -l "$RUNNER_TEMP/main.jsbundle"
      - name: Compile the bundle with Hermes
        if: matrix.part == 'bundle'
        run: |
          hermesc=$(find node_modules -path '*linux64-bin/hermesc' -type f | head -1)
          [ -n "$hermesc" ] || { echo "::error::no Linux hermesc under node_modules"; exit 1; }
          echo "compiling with $hermesc"
          "$hermesc" -emit-binary -O -out "$RUNNER_TEMP/main.hbc" "$RUNNER_TEMP/main.jsbundle"
          ls -l "$RUNNER_TEMP/main.hbc"
