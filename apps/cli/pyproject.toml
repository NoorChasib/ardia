[project]
name = "nilla-browser"
version = "0.0.0.dev0"
description = "The nilla-browser command: drive a running Nilla from Python."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "websockets==16.1.1",
]

[project.scripts]
nilla-browser = "nilla_browser_cli.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "nilla_browser_cli"
